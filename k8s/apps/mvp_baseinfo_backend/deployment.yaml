apiVersion: apps/v1
kind: Deployment
metadata:
  name:  mvp-baseinfo 
  namespace: default
  labels:
    app:  mvp-baseinfo
spec:
  selector:
    matchLabels:
      app: mvp-baseinfo
  replicas: 1
  template:
    metadata:
      labels:
        app:  mvp-baseinfo
    spec:
      imagePullSecrets:
        - name: acrsecret
      # initContainers:
        # Init containers are exactly like regular containers, except:
          # - Init containers always run to completion.
          # - Each init container must complete successfully before the next one starts.
      containers:
      - name:  mvp-baseinfo
        image:  acrteam03.azurecr.io/mvp_baseinfo:e0d8ab9091cd2e8eeca14335940a712e63a5f7b4

        # resources:
        #   requests:
        #     cpu: 100m
        #     memory: 100Mi
        #   limits:
        #     cpu: 100m
        #     memory: 100Mi
        # livenessProbe:
        #   tcpSocket:
        #     port: 80
        #   initialDelaySeconds: 5
        #   timeoutSeconds: 5
        #   successThreshold: 1
        #   failureThreshold: 3
        #   periodSeconds: 10
        # readinessProbe:
        #   httpGet:
        #     path: /_status/healthz
        #     port: 80
        #   initialDelaySeconds: 5
        #   timeoutSeconds: 2
        #   successThreshold: 1
        #   failureThreshold: 3
        #   periodSeconds: 10

        env:
          - name: EVENTHUB_USERNAME
            value: "$ConnectionString"

          - name: EVENTHUB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: mvp-secret
                key: KAFKA_CONNECTION_STRING

          - name: EVENTHUB_CONSUMER_GROUP
            value: "mvp-baseinfo"

          - name: EVENTHUB_NAMESPACE
            value: "eh-az01-team03-sbox-poc-117"

          - name: DB_DRIVER_CLASS_NAME
            value: "com.mysql.cj.jdbc.Driver"
          
          - name: DB_URL
            valueFrom:
              configMapKeyRef:
                name: mvp-configmap
                key: DB_URL

          - name: DB_USERNAME
            valueFrom:
              secretKeyRef:
                name: mvp-secret
                key: DB_USERNAME

          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: mvp-secret
                key: DB_PASSWORD

          - name: REDIS_HOST
            valueFrom:
              configMapKeyRef:
                name: mvp-configmap
                key: REDIS_HOST

          - name: REDIS_PORT
            valueFrom:
              configMapKeyRef:
                name: mvp-configmap
                key: REDIS_PORT

          - name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: mvp-secret
                key: REDIS_PASSWORD

          - name: REDIS_SSL_ENABLED
            value: "false"

        ports:
        - containerPort: 8080 
          name:  mvp-baseinfo
        # volumeMounts:
        # - name: localtime
        #   mountPath: /etc/localtime
      # volumes:
      #   - name: localtime
      #     hostPath:
      #       path: /usr/share/zoneinfo/Asia/Shanghai
      restartPolicy: Always