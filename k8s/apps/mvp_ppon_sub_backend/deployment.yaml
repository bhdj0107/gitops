apiVersion: apps/v1
kind: Deployment
metadata:
  name:  mvp-ppon-sub
  namespace: default
  labels:
    app:  mvp-ppon-sub
spec:
  selector:
    matchLabels:
      app: mvp-ppon-sub
  replicas: 1
  template:
    metadata:
      labels:
        app:  mvp-ppon-sub
    spec:
      imagePullSecrets:
        - name: acrsecret
      # initContainers:
        # Init containers are exactly like regular containers, except:
          # - Init containers always run to completion.
          # - Each init container must complete successfully before the next one starts.
      containers:
      - name:  mvp-ppon-sub
        image:  acrteam03.azurecr.io/mvp_ppon_sub:152a9f231637c02ef0a2942b484d449f49a1c5f4

        # resources:
        #   requests:
        #     cpu: 100m
        #     memory: 100Mi
        #   limits:
        #     cpu: 100m
        #     memory: 100Mi
        # livenessProbe:
        #   tcpSocket:
        #     port: 80
        #   initialDelaySeconds: 5
        #   timeoutSeconds: 5
        #   successThreshold: 1
        #   failureThreshold: 3
        #   periodSeconds: 10
        # readinessProbe:
        #   httpGet:
        #     path: /_status/healthz
        #     port: 80
        #   initialDelaySeconds: 5
        #   timeoutSeconds: 2
        #   successThreshold: 1
        #   failureThreshold: 3
        #   periodSeconds: 10

        env:
        - name: DB_URL
          valueFrom:
            configMapKeyRef:
              name: mvp-configmap
              key: DB_URL_PPON

        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: mvp-configmap
              key: DB_NAME

        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: mvp-secret
              key: DB_USERNAME

        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mvp-secret
              key: DB_PASSWORD

        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: mvp-configmap
              key: REDIS_HOST

        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: mvp-configmap
              key: REDIS_PORT

        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mvp-secret
              key: REDIS_PASSWORD

        - name: KAFKA_SERVERS
          valueFrom:
            configMapKeyRef:
              name: mvp-configmap
              key: EVENTHUB_HOST

        - name: KAFKA_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: mvp-secret
              key: KAFKA_CONNECTION_STRING

        - name: CUSTINFO_API_URL
          valueFrom:
            configMapKeyRef:
              name: mvp-configmap
              key: CUSTINFO_API_URL

        - name: KAFKA_CONSUMER_GROUP
          value: "mvp-ppon-sub"

        ports:
        - containerPort: 8080
          name:  mvp-ppon-sub
        # volumeMounts:
        # - name: localtime
        #   mountPath: /etc/localtime
      # volumes:
      #   - name: localtime
      #     hostPath:
      #       path: /usr/share/zoneinfo/Asia/Shanghai
      restartPolicy: Always
