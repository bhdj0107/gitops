# apps/mvp-baseinfo-backend.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mvp-baseinfo-backend
  namespace: default
spec:
  project: default
  source:
    repoURL: https://github.com/kt-ktk-03/GitOps.git
    targetRevision: main
    path: k8s/apps/mvp_baseinfo_backend
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true